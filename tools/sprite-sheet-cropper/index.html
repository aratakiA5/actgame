<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>7x6 → 4x4 スプライトシート変換</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#111827;color:#f3f4f6}main{max-width:1400px;margin:auto;padding:24px}h1{font-size:24px;margin:0 0 8px}.muted{color:#9ca3af}.panel{background:#1f2937;border:1px solid #374151;border-radius:12px;padding:16px;margin-top:16px}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:end}.field{display:grid;gap:5px}.field label{font-size:12px;color:#d1d5db}input[type=number]{width:90px}input,button{font:inherit}input[type=file],input[type=number]{background:#111827;color:#f3f4f6;border:1px solid #4b5563;border-radius:8px;padding:8px}button{border:0;border-radius:8px;padding:9px 14px;background:#2563eb;color:white;cursor:pointer}button.secondary{background:#4b5563}button.danger{background:#b91c1c}button:disabled{opacity:.45;cursor:not-allowed}.workspace{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,1fr);gap:16px}.canvas-wrap{position:relative;overflow:auto;background:#0b1020;border-radius:10px;min-height:320px}.canvas-stage{position:relative;display:inline-block;line-height:0}canvas{image-rendering:pixelated;max-width:none}.overlay{position:absolute;inset:0;display:grid;pointer-events:auto}.cell{border:1px solid rgba(255,255,255,.18);position:relative;cursor:pointer}.cell:hover{background:rgba(59,130,246,.18)}.cell.selected{background:rgba(34,197,94,.26);outline:2px solid #22c55e;outline-offset:-2px}.badge{position:absolute;top:3px;left:3px;line-height:1;background:#111827;color:#fff;border-radius:999px;padding:4px 6px;font-size:11px;box-shadow:0 1px 3px #000}.selection-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.slot{aspect-ratio:1;background:#111827;border:1px dashed #4b5563;border-radius:8px;display:grid;place-items:center;overflow:hidden;position:relative}.slot canvas{width:100%;height:100%;object-fit:contain}.slot span{font-size:11px;color:#6b7280;position:absolute;bottom:3px;right:5px}.output canvas{width:min(100%,512px);height:auto;border:1px solid #4b5563;background:repeating-conic-gradient(#222 0 25%,#333 0 50%) 50%/16px 16px}.status{margin-top:10px;font-size:13px;color:#d1d5db}.tips{font-size:13px;line-height:1.7;color:#d1d5db}@media(max-width:900px){.workspace{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>7×6 → 4×4 スプライトシート変換</h1>
<div class="muted">元画像をセル単位で切り出し、選択した16フレームを4×4へ再配置してPNG保存します。</div>
<section class="panel controls">
  <div class="field"><label>画像ファイル</label><input id="file" type="file" accept="image/png,image/*"></div>
  <div class="field"><label>元の列数</label><input id="cols" type="number" min="1" value="7"></div>
  <div class="field"><label>元の行数</label><input id="rows" type="number" min="1" value="6"></div>
  <button id="apply" class="secondary">グリッド更新</button>
  <button id="undo" class="secondary" disabled>1つ戻す</button>
  <button id="clear" class="danger" disabled>選択解除</button>
  <button id="download" disabled>4×4 PNGを保存</button>
</section>
<div id="status" class="status">画像を選択してください。</div>
<section class="workspace">
  <div class="panel">
    <h2>元画像</h2>
    <div class="tips">必要なセルを<strong>出力したい順番</strong>に16個クリックしてください。番号が4×4の左上から右下の順番になります。</div>
    <div class="canvas-wrap"><div class="canvas-stage" id="stage"><canvas id="source"></canvas><div id="overlay" class="overlay"></div></div></div>
  </div>
  <div>
    <section class="panel"><h2>選択フレーム</h2><div id="slots" class="selection-grid"></div></section>
    <section class="panel output"><h2>4×4 出力プレビュー</h2><canvas id="output"></canvas></section>
  </div>
</section>
</main>
<script>
const fileInput=document.getElementById('file');
const colsInput=document.getElementById('cols');
const rowsInput=document.getElementById('rows');
const applyBtn=document.getElementById('apply');
const undoBtn=document.getElementById('undo');
const clearBtn=document.getElementById('clear');
const downloadBtn=document.getElementById('download');
const source=document.getElementById('source');
const sctx=source.getContext('2d',{alpha:true});
const output=document.getElementById('output');
const octx=output.getContext('2d',{alpha:true});
const overlay=document.getElementById('overlay');
const slots=document.getElementById('slots');
const stage=document.getElementById('stage');
const status=document.getElementById('status');
let image=null;
let selected=[];
let cols=7,rows=6;

function makeSlots(){
  slots.innerHTML='';
  for(let i=0;i<16;i++){
    const div=document.createElement('div');div.className='slot';
    const c=document.createElement('canvas'); c.width=64;c.height=64;div.appendChild(c);
    const span=document.createElement('span');span.textContent=i+1;div.appendChild(span);slots.appendChild(div);
  }
}
makeSlots();

fileInput.addEventListener('change',()=>{
  const file=fileInput.files?.[0]; if(!file)return;
  const url=URL.createObjectURL(file);
  const img=new Image();
  img.onload=()=>{URL.revokeObjectURL(url);image=img;selected=[];renderSource();renderAll();};
  img.src=url;
});
applyBtn.addEventListener('click',()=>{cols=Math.max(1,parseInt(colsInput.value)||7);rows=Math.max(1,parseInt(rowsInput.value)||6);selected=[];renderSource();renderAll();});
undoBtn.addEventListener('click',()=>{selected.pop();renderAll();});
clearBtn.addEventListener('click',()=>{selected=[];renderAll();});
downloadBtn.addEventListener('click',()=>{
  if(selected.length!==16)return;
  const a=document.createElement('a');a.href=output.toDataURL('image/png');a.download='sprite-sheet-4x4.png';a.click();
});

function renderSource(){
  if(!image){source.width=1;source.height=1;overlay.innerHTML='';return;}
  source.width=image.naturalWidth;source.height=image.naturalHeight;
  sctx.clearRect(0,0,source.width,source.height);sctx.imageSmoothingEnabled=false;sctx.drawImage(image,0,0);
  stage.style.width=source.width+'px';stage.style.height=source.height+'px';
  overlay.style.gridTemplateColumns=`repeat(${cols},1fr)`;overlay.style.gridTemplateRows=`repeat(${rows},1fr)`;
  overlay.innerHTML='';
  for(let i=0;i<cols*rows;i++){
    const cell=document.createElement('div');cell.className='cell';cell.dataset.index=i;
    cell.addEventListener('click',()=>selectCell(i));overlay.appendChild(cell);
  }
}
function selectCell(index){
  if(!image||selected.length>=16||selected.includes(index))return;
  selected.push(index);renderAll();
}
function sourceRect(index){
  const col=index%cols,row=Math.floor(index/cols);
  const x0=Math.round(col*image.naturalWidth/cols),x1=Math.round((col+1)*image.naturalWidth/cols);
  const y0=Math.round(row*image.naturalHeight/rows),y1=Math.round((row+1)*image.naturalHeight/rows);
  return {x:x0,y:y0,w:x1-x0,h:y1-y0};
}
function renderAll(){
  [...overlay.children].forEach((cell,i)=>{
    const pos=selected.indexOf(i);cell.classList.toggle('selected',pos>=0);cell.innerHTML=pos>=0?`<span class="badge">${pos+1}</span>`:'';
  });
  const slotEls=[...slots.children];
  slotEls.forEach((slot,i)=>{
    const c=slot.querySelector('canvas'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);ctx.imageSmoothingEnabled=false;
    if(image&&selected[i]!=null){const r=sourceRect(selected[i]);c.width=r.w;c.height=r.h;ctx.imageSmoothingEnabled=false;ctx.drawImage(image,r.x,r.y,r.w,r.h,0,0,r.w,r.h);}
    else {c.width=64;c.height=64;}
  });
  renderOutput();
  undoBtn.disabled=selected.length===0;clearBtn.disabled=selected.length===0;downloadBtn.disabled=selected.length!==16;
  if(!image)status.textContent='画像を選択してください。';
  else status.textContent=`画像: ${image.naturalWidth}×${image.naturalHeight}px / グリッド: ${cols}×${rows} / 選択: ${selected.length}/16`;
}
function renderOutput(){
  if(!image){output.width=4;output.height=4;octx.clearRect(0,0,4,4);return;}
  const rects=selected.map(sourceRect);
  const cellW=rects.length?Math.max(...rects.map(r=>r.w)):Math.round(image.naturalWidth/cols);
  const cellH=rects.length?Math.max(...rects.map(r=>r.h)):Math.round(image.naturalHeight/rows);
  output.width=cellW*4;output.height=cellH*4;octx.clearRect(0,0,output.width,output.height);octx.imageSmoothingEnabled=false;
  rects.forEach((r,i)=>{const dx=(i%4)*cellW,dy=Math.floor(i/4)*cellH;octx.drawImage(image,r.x,r.y,r.w,r.h,dx,dy,r.w,r.h);});
}
</script>
</body>
</html>
