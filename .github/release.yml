changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: "新機能"
      labels:
        - enhancement
        - feature
    - title: "不具合修正"
      labels:
        - bug
        - fix
    - title: "ドキュメント"
      labels:
        - documentation
        - docs
    - title: "内部改善・整理"
      labels:
        - refactor
        - maintenance
    - title: "その他の変更"
      labels:
        - "*"
